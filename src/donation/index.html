<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">z
    <meta name="robots" content="noindex,nofollow">
    <title>360手机-客服在线</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            color: #333;
            padding: 24px 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 16px;
        }
        /* 公告区域 */
        .notice-wrap {
            background: #fff8e6;
            border: 1px solid #ffdd88;
            border-radius: 8px;
            padding: 12px 16px;
            height: 80px;
            overflow: hidden;
            position: relative;
            margin-bottom: 30px;
        }
        .notice-item {
            height: 56px;
            line-height: 56px;
            text-align: center;
            font-size: 15px;
            color: #ff2222;
            font-weight: bold;
        }
        .notice-inner {
            transition: transform 0.4s ease;
        }
        .title-block {
            text-align: center;
            margin-bottom: 20px;
        }
        .title-block h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .tip-text {
            font-size: 14px;
            color: #666;
        }
        /* 按钮组 */
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-wechat {
            background-color: #07c160;
            color: #fff;
        }
        .btn-alipay {
            background-color: #888;
            color: #fff;
            cursor: not-allowed;
        }
        /* 图片展示区 */
        .pic-container {
            text-align: center;
            min-height: 240px;
            margin-bottom: 24px;
        }
        .pic-container img {
            max-width: 220px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .empty-tip {
            line-height: 240px;
            color: #999;
        }
        /* 触发弹窗按钮 */
        .trigger-modal-btn {
            display: block;
            margin: 0 auto;
            padding: 12px 24px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }
        /* 模态弹窗遮罩 */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.65);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 16px;
        }
        .modal-box {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            max-width: 340px;
            width: 100%;
        }
        .modal-box img {
            width: 100%;
            border-radius: 6px;
        }
        .modal-close {
            margin-top:14px;
            width:100%;
            padding:10px;
            border:none;
            background:#ef4444;
            color:#fff;
            border-radius:6px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <h1>公告中心</h1>
    <!-- 公告滚动区域 3秒切换 -->
    <div class="notice-wrap">
        <div class="notice-inner" id="noticeInner">
            <div class="notice-item">提示一：扫码≥3 （不用截图）</div>
            <div class="notice-item">提示二：因恶意咨询打扰，仅捐赠者=回复（其它无视）</div>
            <div class="notice-item">提示三：带来不便，实在抱歉（异常，可联系说明）</div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-wechat" id="btnWx">微信捐赠</button>
        <button class="btn btn-alipay" id="btnAli">支付宝捐赠</button>
    </div>

    <!-- 默认加载微信图片 wx0.jpg -->
    <div class="pic-container" id="picBox">
        <img src="wx0.jpg" alt="微信捐赠二维码">
    </div>

    <button class="trigger-modal-btn" id="openModal">符合捐赠 点我联系（不符无视）</button>

    <!-- 模态弹窗 -->
    <div class="modal-mask" id="modalMask">
        <div class="modal-box">
            <img src="my-wx.png" alt="联系微信">
            <button class="modal-close" id="closeModal">关闭</button>
        </div>
    </div>

<script>
    // ========== 公告3秒自动轮播 ==========
    const noticeInner = document.getElementById('noticeInner');
    const noticeItems = document.querySelectorAll('.notice-item');
    const noticeHeight = 56;
    let currentNoticeIndex = 0;
    const noticeTotal = noticeItems.length;

    function rollNotice() {
        currentNoticeIndex ++;
        if(currentNoticeIndex >= noticeTotal){
            currentNoticeIndex = 0;
        }
        noticeInner.style.transform = `translateY(-${currentNoticeIndex * noticeHeight}px)`;
    }
    // 每3000ms切换
    setInterval(rollNotice, 3000);

    // ========== 二维码切换按钮逻辑 ==========
    const btnWx = document.getElementById('btnWx');
    const btnAli = document.getElementById('btnAli');
    const picBox = document.getElementById('picBox');

    btnWx.addEventListener('click', function(){
        picBox.innerHTML = `<img src="wx0.jpg" alt="微信捐赠二维码">`;
    });
    btnAli.addEventListener('click', function(){
        picBox.innerHTML = `<div class="empty-tip">图片加载失败!</div>`;
    });

    // ========== 模态弹窗逻辑 ==========
    const modalMask = document.getElementById('modalMask');
    const openModalBtn = document.getElementById('openModal');
    const closeModalBtn = document.getElementById('closeModal');

    openModalBtn.addEventListener('click', function(){
        modalMask.style.display = 'flex';
    });
    closeModalBtn.addEventListener('click', function(){
        modalMask.style.display = 'none';
    });
    // 点击遮罩关闭弹窗
    modalMask.addEventListener('click', function(e){
        if(e.target === modalMask){
            modalMask.style.display = 'none';
        }
    });
</script>
</body>
</html>
